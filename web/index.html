<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Flutter reemplaza este valor con --base-href al compilar -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Músculo y Forma</title>
  <meta name="description" content="Músculo y Forma (GMYF): tu gimnasio en el bolsillo. Rutinas, mediciones, progreso y panel de coach.">
  <meta name="application-name" content="Músculo y Forma">
  <meta name="theme-color" content="#23246B">
  <link rel="canonical" href="https://gmyf-app.onrender.com/">

  <!-- Open Graph / redes sociales -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Músculo y Forma">
  <meta property="og:title" content="Músculo y Forma">
  <meta property="og:description" content="Rutinas, mediciones, progreso y panel de coach del gimnasio Músculo y Forma.">
  <meta property="og:url" content="https://gmyf-app.onrender.com/">
  <meta property="og:image" content="https://gmyf-app.onrender.com/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:image:alt" content="Emblema GMYF de Músculo y Forma">
  <meta property="og:locale" content="es_MX">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Músculo y Forma">
  <meta name="twitter:description" content="Rutinas, mediciones, progreso y panel de coach del gimnasio Músculo y Forma.">
  <meta name="twitter:image" content="https://gmyf-app.onrender.com/icons/og-image.png">

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Músculo y Forma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Pantalla de carga: se oculta sola (solo CSS) cuando Flutter inserta su vista -->
  <style>
    html, body { margin: 0; height: 100%; background: #F5F6FB; }
    #gmyf-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #F5F6FB; color: #23246B;
      font: 600 18px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 16px;
    }
    #gmyf-splash img { width: 96px; height: 96px; animation: gmyf-pulse 1.6s ease-in-out infinite; }
    #gmyf-splash small { font-weight: 400; font-size: 14px; opacity: .75; }
    @keyframes gmyf-pulse { 50% { transform: scale(.92); opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { #gmyf-splash img { animation: none; } }
    body:has(flutter-view) #gmyf-splash,
    body:has(flt-glass-pane) #gmyf-splash { display: none; }
  </style>
</head>
<body>
  <div id="gmyf-splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" width="96" height="96">
    <div>Músculo y Forma</div>
    <small>Cargando…</small>
  </div>
  <noscript>
    <p style="font-family: system-ui, sans-serif; color: #23246B; text-align: center; padding: 16px;">
      Músculo y Forma necesita JavaScript para funcionar. Actívalo en tu navegador y vuelve a cargar la página.
    </p>
  </noscript>
  <script src="splash.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
